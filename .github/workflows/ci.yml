name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build + component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build dist/
        run: npm run build

      # dist/ is committed (it feeds both the npm tarball and the docs site's
      # vendored pack bundle). Fail if a source change was pushed without it.
      - name: dist/ is in sync with src/
        run: |
          if ! git diff --quiet -- dist; then
            git --no-pager diff --stat -- dist
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Specs run against the committed docs/ build (tests/serve-docs.mjs).
      - name: Component tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  site:
    name: Docs site builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site
