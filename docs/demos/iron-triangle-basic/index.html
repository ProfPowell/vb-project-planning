<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iron Triangle — Basic Demo</title>
  <link rel="stylesheet" href="/vb-project-planning/assets/vendor/vanilla-breeze.css?v=mr41ir6i">
  <link rel="stylesheet" href="/vb-project-planning/assets/pack/vb-project-planning.css?v=mr41ir6i">
  <style>
    body { padding: var(--size-l); background: var(--color-surface); }
    p { color: var(--color-text-muted); margin-block-end: var(--size-l); }
  </style>
</head>
<body data-layout="stack" data-layout-gap="l">
  <header>
    <h1>Iron Triangle</h1>
    <p>The triangle is the UI. Click any vertex (Scope, Time, Cost) to open its editor; click the center “Quality” target to jump to the quality picker. Hover any target for a tooltip preview.</p>
  </header>

  <iron-triangle name="triangle" data-focus-factor="0.6" data-quality-href="/vb-project-planning/elements/quality-target/" data-quality-summary="3 critical: perf, sec, a11y"></iron-triangle>

  <script type="module" src="/vb-project-planning/assets/pack/vb-project-planning.js?v=mr41ir6i"></script>
</body>
</html>
